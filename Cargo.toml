[workspace]
members = ["server", "client"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
bincode = "2.0"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
tokio = { version = "1.45", features = ["full"]}
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}
